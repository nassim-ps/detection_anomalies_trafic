# Tests unitaires puis image ML publiée sur Docker Hub, pour tout code visant main.
#   push sur main      -> tags latest, sha-<court>
#   pull request → main -> tag pr-<numéro>
# Prérequis GitHub : variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (jeton d'accès Docker Hub).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: nassimphenix/detection-anomalies-trafic

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: python -m pytest

  image:
    needs: test
    # Les PR venant d'un fork n'ont pas accès aux secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: ml
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
