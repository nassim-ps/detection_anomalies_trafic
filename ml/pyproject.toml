[project]
name = "trafic-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trafic_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: nécessite les services docker compose (postgres, umami)"]
addopts = "-m 'not db'"
